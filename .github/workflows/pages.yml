# Publishes the website: site/ plus every repo document, built by tools/build_site.py. Separate from
# build.yml so a site change never needs a plugin build. A broken internal link fails the build step.
# Actions are the lowest major that runs on Node 24, same rule as build.yml.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_site.py"
      - "tools/tex_overrides_README.txt"
      - "README.md"
      - "COLLECTIONS.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Build the site
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet markdown-it-py==4.0.0 pyyaml==6.0.3
          .venv/bin/python tools/build_site.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
