name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # build provenance signing
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: texoverride.asi
          path: texoverride.asi

      # Free, signed proof that this exact .asi came out of this repo at this commit. Does
      # nothing for antivirus scores, but it turns "trust me, CI built it" into something a
      # player can check: gh attestation verify texoverride.asi --repo <repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: texoverride.asi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = the top (current) section of CHANGELOG.md
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          {
            echo
            echo '---'
            echo
            echo 'SHA-256 of `texoverride.asi`:'
            echo
            echo '```'
            sha256sum texoverride.asi | cut -d" " -f1
            echo '```'
            echo
            echo 'Check it was built from this repository, by this commit:'
            echo
            echo '```'
            echo "gh attestation verify texoverride.asi --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" texoverride.asi --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" texoverride.asi --clobber
