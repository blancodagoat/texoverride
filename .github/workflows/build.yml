name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # build provenance signing
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test managed-pack manifest
        shell: cmd
        run: tools\pack_manifest_test.bat

      - name: Build
        shell: cmd
        run: build.bat

      # /Brepro makes the linker stamp a content hash instead of a clock, so the same source
      # must produce the same bytes. Building twice and comparing is what turns that from a flag
      # into a guarantee: anyone can build this themselves and check their .asi against the
      # release, which is the whole answer to "is this binary really the source above it".
      - name: Verify reproducible rebuild
        shell: pwsh
        run: |
          $first = (Get-FileHash .\texoverride.asi -Algorithm SHA256).Hash
          & .\build.bat
          if ($LASTEXITCODE -ne 0) { throw "Second build failed with exit code $LASTEXITCODE" }
          $second = (Get-FileHash .\texoverride.asi -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "Build is not reproducible: $first != $second" }
          Write-Host "reproducible: $first"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: texoverride.asi
          path: texoverride.asi

      # The zip is the first-install download: the plugin plus a ready-made tex_overrides with an
      # empty folder per collection, so nobody has to guess or spell a collection name. The bare
      # .asi stays on the release for upgrades, where overwriting somebody's folder would be wrong.
      - name: Pack zip
        shell: pwsh
        run: ./tools/make-zip.ps1

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: texoverride.zip
          path: texoverride.zip

      # Free, signed proof that this exact .asi came out of this repo at this commit. Does
      # nothing for antivirus scores, but it turns "trust me, CI built it" into something a
      # player can check: gh attestation verify texoverride.asi --repo <repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            texoverride.asi
            texoverride.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = the top (current) section of CHANGELOG.md
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          {
            echo
            echo '---'
            echo
            echo 'Two downloads. **texoverride.zip** is the one to get if this is your first'
            echo 'time: it holds the plugin and a ready-made `tex_overrides` folder with a'
            echo 'folder already made for every collection you can use. **texoverride.asi** on'
            echo 'its own is for upgrading, so your existing folder is left alone.'
            echo
            echo 'SHA-256:'
            echo
            echo '```'
            sha256sum texoverride.asi texoverride.zip
            echo '```'
            echo
            echo 'Check it was built from this repository, by this commit:'
            echo
            echo '```'
            echo "gh attestation verify texoverride.asi --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" texoverride.zip texoverride.asi --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" texoverride.zip texoverride.asi --clobber
