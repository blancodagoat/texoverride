name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: texoverride.asi
          path: texoverride.asi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = the top (current) section of CHANGELOG.md
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" texoverride.asi --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" texoverride.asi --clobber
